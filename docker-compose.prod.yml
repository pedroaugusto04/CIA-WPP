services:
  whatsapp-webhook:
    build:
      context: .
    image: whatsapp-webhook:latest
    container_name: whatsapp-webhook
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - ./config/public-config.env
      - .env
    ports:
      - "127.0.0.1:18084:8080"
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
